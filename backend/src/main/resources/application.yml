server:
  port: 8080

spring:
  application:
    name: giapha
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giapha}
    username: ${DB_USER:giapha}
    password: ${DB_PASSWORD:giapha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  super-admin:
    username: ${SUPER_ADMIN_USERNAME:superadmin}
    password: ${SUPER_ADMIN_PASSWORD:Admin@123}
    email: ${SUPER_ADMIN_EMAIL:admin@giapha.local}
  family:
    # true: dong ho moi tao duoc kich hoat ngay, false: cho Super Admin duyet
    auto-approve: ${FAMILY_AUTO_APPROVE:false}
  reminder:
    cron: ${REMINDER_CRON:0 0 7 * * *}
    default-days-before: ${REMINDER_DEFAULT_DAYS:3,1}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@giapha.local}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
